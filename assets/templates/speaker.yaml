name: speaker-card
background: assets/backgrounds/meetup-background.jpg
size:
  width: 1080
  height: 1080
defaults:
  font: assets/fonts/LBRITE.TTF
  color: "#FFFFFF"
  size: 32

elements:
  - id: speaker_photo
    type: image
    source: "{{ event.talks[talk_index].image | default('') }}"
    box: { x: 110, y: 150, w: 310, h: 310 }
    shape: circle
    fit: cover

  - id: badge
    type: text
    value: "Speaker Spotlight"
    box: { x: 460, y: 160, w: 500, h: 80 }
    font: assets/fonts/LBRITED.TTF
    size: 48
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: false

  - id: meetup_title
    type: text
    value: "{{ event.title | default('Meetup Edition') }}"
    box: { x: 110, y: 500, w: 860, h: 140 }
    size: 58
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: talk_title
    type: text
    value: "{{ event.talks[talk_index].title | default('Talk title coming soon') }}"
    box: { x: 110, y: 655, w: 860, h: 175 }
    size: 46
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: speaker_name
    type: text
    value: "{{ event.talks[talk_index].speaker | default('Guest speaker') }}"
    box: { x: 110, y: 840, w: 860, h: 90 }
    font: assets/fonts/LBRITED.TTF
    size: 42
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: date
    type: text
    value: "{{ event.date | date('%d %b %Y') }}"
    box: { x: 110, y: 950, w: 600, h: 70 }
    size: 34
    color: "#000000"
    align: left
    valign: top
    wrap: false
